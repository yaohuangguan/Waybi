name: CI
on:
  push:
  pull_request:

jobs:
  web-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: node --check scripts/flutter-dev.mjs
      - run: node --check scripts/ios-device.mjs
      - run: node --check scripts/d1-migrate-remote.mjs
      - run: node --test scripts/d1-migrate-remote.test.mjs scripts/check-mobile-coverage.test.mjs
      - run: pnpm typecheck:server
      - run: pnpm typecheck:nz-routing
      - run: pnpm test
      - run: pnpm build
      - run: pnpm seo:check
      - run: pnpm check:worker

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage --concurrency=2
      - name: Analyze and test Waybi companions
        working-directory: packages/waybi_friends
        run: |
          flutter pub get
          flutter analyze
          flutter test --coverage --concurrency=2
      - name: Analyze and test reusable waybi_map package
        working-directory: packages/waybi_map
        run: |
          dart pub get
          dart analyze
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      - name: Require reviewed coverage for every mobile source file
        working-directory: .
        run: node scripts/check-mobile-coverage.mjs
      - name: Save mobile coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-coverage
          path: |
            apps/mobile/coverage/lcov.info
            packages/waybi_friends/coverage/lcov.info
            packages/waybi_map/coverage/lcov.info
            coverage/mobile-inventory.json
          retention-days: 7
          if-no-files-found: error

  ios-compile:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Test native navigation URL handling
        run: swift test --package-path ios --enable-code-coverage
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app for device signing
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/waybi-ios-unsigned.tar.gz" -C build/ios/iphoneos Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: waybi-ios-unsigned
          path: ${{ runner.temp }}/waybi-ios-unsigned.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  android-compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web-worker
      - flutter
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deploy token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - name: Deploy Cloudflare Worker
        run: pnpm deploy
