name: CI
on:
  push:
  pull_request:

jobs:
  web-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: node --check scripts/flutter-dev.mjs
      - run: node --check scripts/ios-device.mjs
      - run: pnpm typecheck:server
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:worker

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Analyze and test Waybi companions
        working-directory: packages/waybi_friends
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze and test reusable waybi_map package
        working-directory: packages/waybi_map
        run: |
          dart pub get
          dart analyze
          dart test

  ios-compile:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  android-compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web-worker
      - flutter
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deploy token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - name: Check for D1 migration changes
        id: d1_changes
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin main
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "${{ github.sha }}" -- migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.d1_changes.outputs.changed == 'true'
        run: pnpm db:migrate:remote
      - name: Deploy Cloudflare Worker
        run: pnpm deploy
