openapi: 3.0.3
info:
  title: Waybi API
  version: 0.1.0
  description: >-
    Shared HTTP contract for the PWA and mobile clients. Every endpoint may
    answer 429 (per-client burst limit, with Retry-After) where noted and 500
    with a generic body and requestId; error bodies never contain internal
    details.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: API and camera cache status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cameraCount: { type: integer }
                  syncStatus: { type: string, enum: [seed, live, stale] }
        '500': { $ref: '#/components/responses/InternalError' }
  /cameras:
    get:
      summary: All fixed safety cameras and source freshness
      responses:
        '200':
          description: Camera collection
          content:
            application/json:
              schema:
                type: object
                required: [cameras, sourceUpdatedAt, syncStatus]
                properties:
                  cameras:
                    type: array
                    items: { $ref: '#/components/schemas/Camera' }
                  sourceUpdatedAt: { type: string, format: date }
                  checkedAt: { type: string, format: date-time, nullable: true }
                  syncStatus: { type: string, enum: [seed, live, stale] }
                  syncError: { type: string, nullable: true }
                  source: { type: string, format: uri }
  /traffic-flow:
    get:
      summary: Live Auckland motorway congestion from NZTA Traffic Conditions
      description: Returns directional motorway segments with current congestion labels. Coverage follows the official NZTA traffic-conditions feed and is not a claim of traffic coverage on every local street.
      responses:
        '200':
          description: Live or retained motorway traffic segments
          content:
            application/json:
              schema:
                type: object
                required: [segments, syncStatus]
                properties:
                  syncStatus: { type: string, enum: [live, stale] }
                  sourceUpdatedAt: { type: string, format: date-time, nullable: true }
                  checkedAt: { type: string, format: date-time }
                  source: { type: string, format: uri }
                  segments:
                    type: array
                    items:
                      type: object
                      required: [id, name, congestion, level, start, end]
                      properties:
                        id: { type: string }
                        motorway: { type: string }
                        name: { type: string }
                        direction: { type: string }
                        congestion: { type: string }
                        level: { type: string, enum: [free, moderate, heavy, unknown] }
                        start:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        end:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
  /parking:
    get:
      summary: AT Open GIS car parks within 1.5 km of a New Zealand coordinate
      description: Auckland Transport locations and static capacity only; live availability is not asserted. Returns an empty array outside AT coverage.
      parameters:
        - in: query
          name: at
          required: true
          description: longitude,latitude
          schema: { type: string }
      responses:
        '200':
          description: Nearby AT parking locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  sourceUrl: { type: string, format: uri }
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/ParkingPlace' }
        '400': { description: Invalid coordinate }
        '502': { description: AT source temporarily unavailable }
  /search:
    get:
      summary: Search addresses and places (Nominatim plus official address sources)
      description: >-
        With provider=independent this is the independent typeahead stack (same
        as /suggest). Public Nominatim requests are serialized per Worker
        isolate at one per second.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: near
          description: longitude,latitude used to bias results
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string, enum: [en, zh] }
        - in: query
          name: provider
          schema: { type: string, enum: [independent] }
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503':
          description: Search queue busy (code SEARCH_BUSY); retry after the Retry-After header
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /suggest:
    get:
      summary: Place typeahead
      description: >-
        Without provider=independent, Google Places Text Search is used while
        its daily server budget lasts; beyond it the independent (non-Google)
        providers answer instead.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: near
          description: longitude,latitude; nearby results rank ahead of overseas namesakes
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string, enum: [en, zh] }
        - in: query
          name: provider
          schema: { type: string, enum: [independent, geoapify] }
      responses:
        '200':
          description: Ranked suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503':
          description: No place search provider is available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /place-details:
    get:
      summary: Google place details (Google map mode only)
      parameters:
        - in: query
          name: placeId
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,300}$' }
      responses:
        '200': { description: Place details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Place not found }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/GoogleBudgetExhausted' }
  /place-photo:
    get:
      summary: Google place photo proxy (Google map mode only)
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, pattern: '^places/[A-Za-z0-9_-]+/photos/[A-Za-z0-9_-]+$' }
      responses:
        '200': { description: Image bytes }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/GoogleBudgetExhausted' }
  /speed-limit:
    get:
      summary: Posted speed limit from the NZTA National Speed Limit Register
      description: Shared per ~11 m cell (coordinates rounded to 1e-4 degrees) through the edge cache for up to an hour.
      parameters:
        - in: query
          name: at
          required: true
          description: longitude,latitude
          schema: { type: string }
      responses:
        '200':
          description: Current limit, or null outside NZ / without a zone
          content:
            application/json:
              schema:
                type: object
                properties:
                  speedLimitKph: { type: integer, nullable: true }
                  zoneName: { type: string, nullable: true }
                  source: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
  /road-events:
    get:
      summary: Official road events and community reports for a region
      description: >-
        Includes events active now AND events scheduled to start within the
        next scheduledWindowHours (12); check validFrom/validUntil before
        treating an event as active. Without bbox or radiusMeters the whole
        region selected by near (or country) is returned.
      parameters:
        - in: query
          name: near
          description: longitude,latitude selecting the official source region
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string, enum: [NZ, AU] }
        - in: query
          name: bbox
          description: Optional west,south,east,north filter, at most 10 degrees on each side
          schema: { type: string }
        - in: query
          name: radiusMeters
          description: Optional filter around near
          schema: { type: integer, minimum: 100, maximum: 300000 }
      responses:
        '200':
          description: Events in the requested area
          content:
            application/json:
              schema:
                type: object
                required: [events, syncStatus]
                properties:
                  syncStatus: { type: string, enum: [live, stale, unavailable] }
                  checkedAt: { type: string, format: date-time, nullable: true }
                  retrievedAt: { type: string, format: date-time, nullable: true }
                  scheduledWindowHours: { type: integer, example: 12 }
                  failedFeeds:
                    type: array
                    description: Source feeds that failed in the latest refresh; their recent events are retained
                    items: { type: string }
                  officialCoverage:
                    type: array
                    items: { type: string }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/RoadEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /route:
    get:
      summary: Driving route with turn steps
      parameters:
        - in: query
          name: from
          required: true
          description: longitude,latitude
          schema: { type: string }
        - in: query
          name: to
          required: true
          description: longitude,latitude
          schema: { type: string }
        - in: query
          name: stops
          description: Up to 23 longitude,latitude pairs separated by ';'. Any malformed entry is a 400.
          schema: { type: string }
      responses:
        '200':
          description: Route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { description: No driving route found }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Upstream' }
  /route-watches:
    get:
      summary: List the signed-in user's saved Route Watch routes
      description: >-
        Returns the status stored by the 15-minute evaluation. Only watches not
        checked in the last 15 minutes are re-evaluated; if the road-event
        snapshot is unavailable those report status unknown.
      responses:
        '200':
          description: Current Route Watch states from official road-event matching
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlement: { type: string, enum: [plus] }
                  watches:
                    type: array
                    items: { $ref: '#/components/schemas/RouteWatch' }
        '401': { description: Sign in required }
        '403': { $ref: '#/components/responses/PlusRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Create or refresh a Route Watch from the current driving route geometry
      description: Mobile client only (x-waybi-client mobile). At most 8 watches per user; updating an existing label is always allowed.
      responses:
        '201':
          description: Route Watch saved and evaluated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlement: { type: string, enum: [plus] }
                  watch: { $ref: '#/components/schemas/RouteWatch' }
        '400': { description: Invalid route geometry or destination }
        '401': { description: Sign in required }
        '403': { $ref: '#/components/responses/PlusRequired' }
        '409':
          description: Watch limit reached (code ROUTE_WATCH_LIMIT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /route-watches/{id}:
    delete:
      summary: Stop watching a saved route
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Route Watch deleted }
        '400': { description: Malformed route watch id }
        '401': { description: Sign in required }
        '403': { $ref: '#/components/responses/PlusRequired' }
  /voice-packs:
    post:
      summary: Share the signed-in Plus member's recorded navigation voice
      description: >-
        multipart/form-data with a `manifest` JSON part
        ({ name, consent: true, clips: [{ language, phraseId, contentType, bytes, sha256 }] })
        and one file part per clip named `clip:<language>:<phraseId>`. Web
        (same origin) or mobile (x-waybi-client mobile, no Origin) clients only.
        Limits: phraseId ^[a-z0-9_]{1,48}$, language en or zh, content type
        audio/mp4, audio/m4a, audio/x-m4a or audio/aac, 512 B to 256 KB per
        clip, at most 200 clips and 8 MB per pack, name 1-40 characters, at
        most 5 active packs per member. The server recomputes every SHA-256.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: string, description: JSON manifest }
              additionalProperties: { type: string, format: binary }
      responses:
        '201':
          description: Shared; the code and link are ready to send
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { $ref: '#/components/schemas/VoicePack' }
        '400': { description: 'Invalid manifest or clip (codes INVALID_REQUEST, INVALID_CLIP, CLIP_INTEGRITY, CONSENT_REQUIRED)' }
        '401': { description: Sign in required (code SIGN_IN_REQUIRED) }
        '403': { $ref: '#/components/responses/PlusRequired' }
        '409':
          description: Five packs are already shared (code VOICE_PACK_LIMIT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: A clip or the pack is too large (code VOICE_PACK_TOO_LARGE) }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/VoiceSharingUnavailable' }
  /voice-packs/mine:
    get:
      summary: The signed-in member's active shared voice packs (no Plus needed, so a lapsed member can still revoke)
      responses:
        '200':
          description: Active packs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit: { type: integer, example: 5 }
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/VoicePack' }
        '401': { description: Sign in required (code SIGN_IN_REQUIRED) }
        '503': { $ref: '#/components/responses/VoiceSharingUnavailable' }
  /voice-packs/{code}:
    parameters:
      - $ref: '#/components/parameters/VoicePackCode'
    get:
      summary: Public manifest of a shared voice (anyone with the code; viewing is not an import)
      responses:
        '200':
          description: Pack and per-language clip manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: { $ref: '#/components/schemas/SharedVoicePack' }
        '404': { description: Unknown or revoked code (code VOICE_PACK_NOT_FOUND) }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/VoiceSharingUnavailable' }
    delete:
      summary: Revoke a pack you shared; its clips are deleted and the code stops working
      description: Repeat the call if it answered VOICE_PACK_PURGE_FAILED; the pack is already unavailable.
      responses:
        '200': { description: Revoked and removed }
        '401': { description: Sign in required (code SIGN_IN_REQUIRED) }
        '404': { description: Not a pack you shared (code VOICE_PACK_NOT_FOUND) }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: 'Revoked, but some recordings remain; retry (code VOICE_PACK_PURGE_FAILED), or sharing unavailable (VOICE_SHARING_UNAVAILABLE)' }
  /voice-packs/{code}/import:
    parameters:
      - $ref: '#/components/parameters/VoicePackCode'
    post:
      summary: Count one completed install of a shared voice
      description: Web or mobile client only. No account needed.
      responses:
        '200': { description: Counted }
        '404': { description: Unknown or revoked code (code VOICE_PACK_NOT_FOUND) }
        '429': { $ref: '#/components/responses/RateLimited' }
  /voice-packs/{code}/clips/{language}/{phraseId}:
    parameters:
      - $ref: '#/components/parameters/VoicePackCode'
      - in: path
        name: language
        required: true
        schema: { type: string, enum: [en, zh] }
      - in: path
        name: phraseId
        required: true
        schema: { type: string, pattern: '^[a-z0-9_]{1,48}$' }
    get:
      summary: One recorded clip of a shared voice
      description: >-
        Immutable for the life of the pack (cache-control public, one year).
        ETag and x-content-sha256 carry the SHA-256 from the manifest; clients
        verify it before installing. Only misses count toward the rate limit.
      responses:
        '200':
          description: Audio
          content:
            audio/mp4:
              schema: { type: string, format: binary }
            audio/aac:
              schema: { type: string, format: binary }
        '404': { description: Unknown or revoked code, or a phrase not in the pack (code VOICE_PACK_NOT_FOUND) }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/VoiceSharingUnavailable' }
components:
  parameters:
    VoicePackCode:
      in: path
      name: code
      required: true
      description: Ten characters from 23456789ABCDEFGHJKMNPQRSTUVWXYZ; case, spaces and dashes are ignored
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Per-client burst limit reached (code RATE_LIMITED)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PlusRequired:
      description: Waybi Plus is required (code PLUS_REQUIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GoogleBudgetExhausted:
      description: The daily Google budget for this feature is used up (code GOOGLE_BUDGET_EXHAUSTED); retry after Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Upstream:
      description: An upstream provider failed; generic message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected error; generic message with a requestId for support
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VoiceSharingUnavailable:
      description: Voice sharing storage is not available (code VOICE_SHARING_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable, safe to display }
        code: { type: string, example: RATE_LIMITED }
        requestId: { type: string, format: uuid, description: Present on 5xx responses from the global handler }
        retryAfter: { type: integer, description: Seconds, when the request can be retried }
    VoicePack:
      type: object
      properties:
        code: { type: string, example: 7KQ2MXPA4R }
        name: { type: string, maxLength: 40 }
        languages: { type: array, items: { type: string, enum: [en, zh] } }
        clipCount: { type: integer }
        totalBytes: { type: integer }
        createdAt: { type: integer, description: Epoch milliseconds }
        importCount: { type: integer }
        url: { type: string, example: 'https://waybi.co/voice/7KQ2MXPA4R' }
    SharedVoicePack:
      allOf:
        - $ref: '#/components/schemas/VoicePack'
        - type: object
          properties:
            clips:
              type: object
              description: language -> phraseId -> clip
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    bytes: { type: integer }
                    contentType: { type: string }
                    sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Place:
      type: object
      properties:
        id:
          description: Provider identifier (Nominatim returns integers, other providers strings)
          oneOf:
            - { type: string }
            - { type: integer }
        provider: { type: string }
        name: { type: string }
        address: { type: string }
        label: { type: string }
        isPoi: { type: boolean }
        resultType: { type: string }
        countryCode: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceMeters: { type: integer, description: From near, when given }
    RoadEvent:
      type: object
      required: [id, type, location, severity]
      properties:
        id: { type: string }
        type: { type: string, enum: [roadClosure, roadworks, incident, flooding, slip, congestion] }
        severity: { type: string, enum: [critical, warning, advisory] }
        observation: { type: string, enum: [official, observed] }
        location:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
        geometry:
          type: array
          items:
            type: object
            properties:
              latitude: { type: number }
              longitude: { type: number }
        roadName: { type: string, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true, description: May be in the future for scheduled events }
        validUntil: { type: string, format: date-time, nullable: true }
        metadata: { type: object, additionalProperties: true }
    RouteWatch:
      type: object
      required: [id, label, destinationName, enabled, status, eventCount, events]
      properties:
        id: { type: string }
        label: { type: string, description: Stable route key such as home-work or work-home }
        originName: { type: string }
        origin:
          type: object
          nullable: true
          properties:
            latitude: { type: number }
            longitude: { type: number }
        destinationName: { type: string }
        destination:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
        routeProvider: { type: string }
        geometryExpiresAt: { type: string, format: date-time, nullable: true }
        baselineDurationSeconds: { type: integer, nullable: true }
        baselineDistanceMeters: { type: integer, nullable: true }
        enabled: { type: boolean }
        status: { type: string, enum: [healthy, advisory, warning, disrupted, unknown] }
        eventCount: { type: integer }
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Latest evaluation of this watch, including Cron runs that found no change
        updatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              severity: { type: string }
              roadName: { type: string, nullable: true }
              description: { type: string }
              impact: { type: string }
              distanceFromRouteMeters: { type: integer }
    ParkingPlace:
      type: object
      required: [id, source, name, address, coordinate, distanceMeters]
      properties:
        id: { type: string }
        source: { type: string, enum: [at] }
        name: { type: string }
        address: { type: string }
        coordinate:
          type: array
          description: longitude,latitude
          minItems: 2
          maxItems: 2
          items: { type: number }
        distanceMeters: { type: number }
        totalSpaces: { type: integer, nullable: true, description: Published capacity, not live availability }
        mobilitySpaces: { type: integer, nullable: true }
        clearanceMeters: { type: number, nullable: true }
    Camera:
      type: object
      required: [id, name, region, suburb, location, type, latitude, longitude, source, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        suburb: { type: string }
        location: { type: string }
        type: { type: string, enum: ['Spot speed', 'Average speed', 'Red light'] }
        latitude: { type: number }
        longitude: { type: number }
        source: { type: string, format: uri }
        updatedAt: { type: string, format: date }
    Route:
      type: object
      properties:
        coordinates:
          type: array
          description: Polyline points in [longitude, latitude] order
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        distance: { type: number, description: Metres }
        duration: { type: number, description: Seconds }
        steps:
          type: array
          items:
            type: object
            properties:
              distance: { type: number }
              duration: { type: number }
              name: { type: string }
              maneuver: { type: string }
              modifier: { type: string }
              instruction: { type: string }
              location:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
              lanes:
                type: array
